# GitHub Actions: custom 分支持续集成（fork 工作流）
#
# 触发条件：
# - push 到 custom 分支
# - 针对 custom 分支的 pull_request
# - 手动触发（workflow_dispatch，可选是否额外打包 macOS x64）
#
# 流程：
# 1. test job（ubuntu）：前端 format/lint/typecheck/单元测试（pnpm check）
# 2. package job（windows x64 / macos arm64，可选 macos x64）：
#    构建 Tauri 桌面应用并打包安装程序，产物以 artifact 形式上传，不发布 Release。
#
# 与现有 ci.yml（面向 main：Rust clippy/test、packages、jdbc、agents 等）互补，
# 本工作流只服务 custom 分支的日常迭代验证与安装包产出。
# release.yml 依赖仓库私有的签名 / Docker / CNB secrets 且仅在 v* tag 触发，
# fork 环境缺少这些 secrets，因此这里只上传 artifact、不做任何发布。
#
# 打包不签名：tauri.conf.json 已设置 createUpdaterArtifacts=false，
# 无需 TAURI_SIGNING_PRIVATE_KEY；macOS 产物为 ad-hoc 签名，仅适合自用，不可分发公证。
#
# 所需 Secrets：无。sccache 默认走 GitHub Actions 缓存后端；
# 若仓库配置了 SCCACHE_S3_* 系列 secrets，则自动切换到 S3 后端。

name: CI (custom)

on:
  push:
    branches:
      - custom
  pull_request:
    branches:
      - custom
  workflow_dispatch:
    inputs:
      include_mac_x64:
        description: '同时打包 macOS x64'
        type: boolean
        default: false

# 同分支新推送取消仍在进行的旧运行，节省 runner 时间
concurrency:
  group: ci-custom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: frontend check (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Unsupported-platform package warnings are expected during install.
      NPM_CONFIG_LOGLEVEL: error
      # exportSmoke.spec.ts 需要调用 cargo；与上游 frontend job 相同的两层缓存策略
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      # Fork PRs cannot read repository secrets, so retain the GHA backend for them.
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      # 只安装根应用及其 workspace 依赖（packages/cli、packages/mcp-server 不参与）
      - name: 安装前端依赖
        run: pnpm --filter dbx... install --frozen-lockfile

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: 安装 sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          # 独立指纹：本 job 只构建 docs_export_smoke（--no-default-features）
          shared-key: ci-custom-docs-export-smoke-x86_64-unknown-linux-gnu
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/custom' || github.event_name == 'workflow_dispatch' }}

      # exportSmoke.spec.ts 会在测试里 shell out 到该 example；预先构建好，
      # 测试内的 cargo run 才是缓存命中而不是冷编译。
      # --no-default-features：docs 模块不需要 duckdb/mq-admin/sqlcipher/system-fonts，
      # 因此无需安装任何系统开发包。
      - name: 预构建 docs_export_smoke 示例
        run: cargo build -p dbx-core --locked --no-default-features --example docs_export_smoke

      # 守卫已提交的 docs 导出 bundle（assets/docs-export.*）与源码一致
      - name: 校验 docs 导出 bundle
        run: cargo test -p dbx-core --locked --no-default-features --lib docs::export

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        run: ${SCCACHE_PATH} --show-stats

      - name: 前端检查（format / lint / typecheck / vitest）
        run: pnpm check

  package:
    name: package (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # sccache cannot reuse Cargo incremental artifacts, so avoid generating them in CI.
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      # Fork PRs cannot read repository secrets, so retain the GHA backend for them.
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-2022, win, x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macos-latest, mac, arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
            artifact_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: 安装 sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      # 首次冷编译（bundled DuckDB + LTO）耗时较长，缓存对后续运行收益明显
      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: ci-custom-${{ matrix.target }}
          # Preserve completed dependency builds when the packaging step fails.
          cache-on-failure: true
          # custom 分支推送不频繁，保存分支缓存保证下次可复用
          save-if: ${{ github.ref == 'refs/heads/custom' || github.event_name == 'workflow_dispatch' }}

      # 读取应用版本号（src-tauri/tauri.conf.json），用于 artifact 命名，
      # 与安装包内 Tauri 版本保持一致
      - name: 读取应用版本号
        id: app-version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand（pnpm build）会先构建前端，随后编译 Rust 并生成安装包；
      # 不设置任何签名 env：updater 产物已禁用，macOS 走 ad-hoc 签名
      - name: 构建 Tauri 安装包
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbx-${{ matrix.artifact }}-${{ steps.app-version.outputs.version }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  # macOS x64 仅在手动触发并勾选时构建（job 级 if 不允许引用 matrix 上下文）
  package-mac-x64:
    name: package (macos-15-intel, mac, x64)
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.include_mac_x64
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-apple-darwin

      - name: 安装 sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: ci-custom-x86_64-apple-darwin
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/custom' || github.event_name == 'workflow_dispatch' }}

      - name: 读取应用版本号
        id: app-version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri 安装包
        run: pnpm tauri build --target x86_64-apple-darwin --bundles dmg

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbx-macos-x64-${{ steps.app-version.outputs.version }}
          path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
